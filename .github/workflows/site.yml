name: Site verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: TEST_MAIL_SINK=1 npm run preview > /tmp/site-preview.log 2>&1 &
      - run: npm run test:browser
      - run: npm run test:performance
      - run: npm run check:references
      - run: WIDE_LAUNCH_PREVIEW=local npm run build
      - run: node scripts/verify-galaxy-build.mjs
      - run: npm run check:copy
      - run: node --test tests/*.test.mjs
      - run: BASE_URL=http://127.0.0.1:4174 node scripts/verify-launch-preview.mjs
      - run: BASE_URL=http://127.0.0.1:4174 node scripts/verify-solar-bridge.mjs
      - run: COORDINATED_RELEASE=local npm run build
      - run: node scripts/verify-release-build.mjs
      - run: BASE_URL=http://127.0.0.1:4174 node scripts/verify-release-browser.mjs
      - run: BASE_URL=http://127.0.0.1:4174 TEST_PAGE=/ TEST_RELEASE=1 VERIFY_OUTPUT=preview-review/release-motion node scripts/verify-launch-preview.mjs
      - run: BASE_URL=http://127.0.0.1:4174 TEST_PAGE=/ VERIFY_OUTPUT=preview-review/release-flight node scripts/verify-solar-bridge.mjs
      - run: VERIFY_PREFIX=release- npm run test:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-verification
          path: |
            docs/site-v5/logs/
            docs/site-v5/screenshots/
            preview-review/wide-launch/
            preview-review/solar-bridge/
            preview-review/release/
            preview-review/release-motion/
            preview-review/release-flight/
