<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Coordinated social image source</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #111318;
        color: #fbfbf8;
        font-family: Arial, Helvetica, sans-serif;
      }
      .galaxy {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        object-fit: cover;
        object-position: 62% 45%;
        opacity: 0.7;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #111318 0%,
          rgba(17, 19, 24, 0.95) 37%,
          rgba(17, 19, 24, 0.25) 100%
        );
      }
      main {
        position: relative;
        padding: 52px 60px;
        height: 630px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 600;
      }
      .brand img {
        width: 40px;
        height: 40px;
      }
      .eyebrow {
        margin-top: 62px;
        font: 12px monospace;
        letter-spacing: 0.12em;
        color: #c1c5cd;
        text-transform: uppercase;
      }
      h1 {
        font-size: 64px;
        line-height: 1.04;
        letter-spacing: -3px;
        font-weight: 500;
        width: 670px;
        margin: 23px 0 28px;
      }
      p {
        font-size: 19px;
        line-height: 1.5;
        color: #c6cad0;
        max-width: 540px;
      }
      .plan {
        position: absolute;
        right: 60px;
        bottom: 63px;
        width: 270px;
        border: 1px solid #b9bec7;
        border-radius: 8px;
        background: #fbfbf8;
        color: #16181d;
        box-shadow: 0 10px 40px #0005;
        padding: 20px;
      }
      .row {
        padding: 12px 0;
        border-top: 1px solid #d2d5d9;
      }
      .row:first-child {
        border: 0;
        padding-top: 0;
      }
      .row span {
        display: block;
        color: #626874;
        font: 10px monospace;
        text-transform: uppercase;
        margin-bottom: 7px;
      }
      .row strong {
        font-size: 16px;
        font-weight: 500;
      }
      .row:last-child {
        padding-bottom: 0;
      }
      .row:last-child strong {
        color: #b93430;
      }
    </style>
  </head>
  <body>
    <img
      class="galaxy"
      src="../galaxy/landscape-upscaled-2880x1600.webp"
      alt=""
    />
    <div class="scrim"></div>
    <main>
      <div class="brand">
        <img src="../../brand/mark_light.svg" alt="" />Coordinated
      </div>
      <div class="eyebrow">A living plan for the work you agree.</div>
      <h1>Keep the direction clear<br />as the plan changes.</h1>
      <p>The goal. Your contribution.<br />The decisions that connect them.</p>
      <div class="plan">
        <div class="row">
          <span>The direction</span><strong>Help customers adopt Atlas</strong>
        </div>
        <div class="row">
          <span>Your contribution</span><strong>Prepare the launch</strong>
        </div>
        <div class="row">
          <span>When the plan changes</span
          ><strong>Your input stays attached</strong>
        </div>
      </div>
    </main>
  </body>
</html>
